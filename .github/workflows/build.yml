name: Gradle Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Build with Gradle
        run: ./gradlew deploy

      - name: Locate raw JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        id: jar
        shell: bash
        run: |
          set -euo pipefail
          JAR="$(find buildProj/build/libs -maxdepth 1 -type f -name 'TerraformGenerator-*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)"
          if [ -z "$JAR" ]; then
            echo "No TerraformGenerator JAR found in buildProj/build/libs" >&2
            exit 1
          fi
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR")" >> "$GITHUB_OUTPUT"

      - name: Publish raw JAR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
          JAR_PATH: ${{ steps.jar.outputs.path }}
        shell: bash
        run: |
          set -euo pipefail
          gh release delete latest-build --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag >/dev/null 2>&1 || true
          gh release create latest-build "$JAR_PATH" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Latest Build" \
            --notes "Raw TerraformGenerator JAR from the latest successful master build. No ZIP extraction required." \
            --prerelease
